apply plugin: 'com.android.application'

// The JasperEngine editor as an APK. It is NOT a game: there is no PROJECT_ROOT, no assets to
// sync and no player. The native side is the editor's own CMake tree (the repository root's
// CMakeLists.txt with API_BACKEND=android), which builds libjasperengine-editor.so from
// editor/backend/BackendAndroid.cpp and the engine as a shared library beside it.
// From this module's directory: androidstudio/editor -> androidstudio -> workspaces -> engine -> root
def jasperengineRoot = "../../../.."
def jasperengineRootAbs = file(jasperengineRoot).toString()

// What this APK is (tools/android/release_identity.py): release name, build number and the exact
// commit. The release manager's releases.json is the only place a name comes from; a build of an
// unlisted commit is named after that commit and nobody mistakes it for a release.
def jasperIdentity = [:]
try {
    def raw = new File(jasperengineRootAbs + '/tools/android/release_identity.py').text
    // Gradle properties win (CI passes them); else ask the script with the JDK in the image.
    def props = ['jasperReleaseName', 'jasperBuildNumber', 'jasperCommit', 'jasperVersionCode', 'jasperDirty']
    if (props.every { project.hasProperty(it) }) {
        jasperIdentity = [
            releaseName: project.property('jasperReleaseName'),
            buildNumber: project.property('jasperBuildNumber'),
            commit     : project.property('jasperCommit'),
            versionCode: project.property('jasperVersionCode'),
            dirty      : project.property('jasperDirty') == 'true'
        ]
    } else {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine 'python3', jasperengineRootAbs + '/tools/android/release_identity.py', '--json'
            standardOutput = out
            ignoreExitValue = true
        }
        def parsed = new groovy.json.JsonSlurper().parseText(out.toString())
        jasperIdentity = [
            releaseName: parsed.releaseName,
            buildNumber: parsed.buildNumber,
            commit     : parsed.commit,
            versionCode: parsed.versionCode,
            dirty      : parsed.dirty
        ]
    }
} catch (Exception e) {
    // No python3 in the builder, or the script refused: the build still runs, and its APK says
    // "unidentified" instead of claiming a release.
    logger.lifecycle("release identity unavailable: " + e.message)
    jasperIdentity = [releaseName: 'unidentified', buildNumber: 0, commit: 'unknown', versionCode: 1, dirty: true]
}

android {
    compileSdk 36
    // the NDK AGP installs by default, pinned as app/build.gradle pins it: its Clang is above the
    // C++20 floor engine/cmake/JasperEngineToolchain.cmake sets
    ndkVersion = "28.2.13676358"

    defaultConfig {
        // Its own package: installing the editor must not replace a game, and a game must not
        // replace the editor.
        applicationId "com.jaspergameengine.editor"
        minSdkVersion 24
        targetSdkVersion 36
        // From the release manager's manifest: monotonic, so a newer APK always installs over an
        // older one, and the number on the device matches the number in ANDROID_RELEASE_STATUS.md
        versionCode (jasperIdentity.versionCode as Integer)
        // The name a person reads in Settings > Apps, and the one the release notes use
        versionName (jasperIdentity.releaseName + " build " + jasperIdentity.buildNumber)

        externalNativeBuild {
            cmake {
                // arm64-v8a is every phone since 2017; the editor is not shipped through Play,
                // so one ABI is one fast build (JASPERENGINE_ANDROID_ABIS overrides it)
                abiFilters "arm64-v8a"
                def onlyAbis = System.getenv("JASPERENGINE_ANDROID_ABIS")
                if (onlyAbis) {
                    abiFilters.clear()
                    abiFilters(*onlyAbis.split(","))
                }

                arguments "-DANDROID_STL=c++_shared"

                def launcher = System.getenv("CMAKE_CXX_COMPILER_LAUNCHER")
                if (launcher) {
                    arguments "-DCMAKE_C_COMPILER_LAUNCHER=" + launcher,
                              "-DCMAKE_CXX_COMPILER_LAUNCHER=" + launcher
                }
            }
        }
    }

    buildTypes {
        debug {
            // the boot report and its share sheet are debug-only, as in the game runtime
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            // The editor's own top-level CMakeLists.txt: API_BACKEND detects Android
            path jasperengineRootAbs + "/CMakeLists.txt"
        }
    }

    buildFeatures {
        prefab = true
    }

    // ... and in assets/jasper-build.txt, which tools/android/publish.py reads back out of the APK
    // to prove it was built from the commit the release record claims.
    def buildStamp = new File(projectDir, 'src/main/assets/jasper-build.txt')
    buildStamp.parentFile.mkdirs()
    buildStamp.text = "${jasperIdentity.releaseName} build=${jasperIdentity.buildNumber} commit=${jasperIdentity.commit} dirty=${jasperIdentity.dirty}\n"

    // The identity inside the APK, as Java: the launcher's label is not readable from native code
    // without JNI, and the boot report must name the build it came from. Written at configuration,
    // so the file matches the other fields of this build and nothing stale is packaged.
    def buildInfo = new File(projectDir, 'src/main/java/com/jaspergameengine/jasperengine/editor/EditorBuildInfo.java')
    buildInfo.text = """package com.jaspergameengine.jasperengine.editor;

// Generated by editor/build.gradle from tools/android/release_identity.py. Do not edit, do not commit.
public final class EditorBuildInfo {
    private EditorBuildInfo() {}
    public static final String RELEASE_NAME = "${jasperIdentity.releaseName}";
    public static final int BUILD_NUMBER = ${jasperIdentity.buildNumber};
    public static final String COMMIT = "${jasperIdentity.commit}";
    public static final boolean DIRTY = ${jasperIdentity.dirty};
    public static String summary() {
        return RELEASE_NAME + " build #" + BUILD_NUMBER + " (" + COMMIT + (DIRTY ? ", dirty" : "") + ")";
    }
}
"""

    sourceSets {
        main {
            // NOT engine/platform/android/java wholesale: that directory holds the game runtime's
            // MainActivity and its lifecycle bridge, which this app neither needs nor can load
            // (they link the game's native library). Only the boot report is shared, and it
            // depends on nothing else in the package.
            //
            // The path is under engine/, exactly as app/build.gradle names it (there is no
            // platform/ at the repository root): a wrong path here fails the compile with
            // "cannot find symbol JasperBootLog" for every line that uses it.
            java.srcDirs = [
                'src/main/java',
                new File(jasperengineRootAbs + '/engine/platform/android/java').absolutePath
            ]
            java.includes = [
                'com/jaspergameengine/jasperengine/JasperBootLog.java',
                'com/jaspergameengine/jasperengine/editor/**'
            ]
        }
    }

    namespace = 'com.jaspergameengine.jasperengine.editor'
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.games:games-activity:2.0.2"
}
